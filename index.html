      <!-- ====== CODE EDITOR / EDITOR DE CÓDIGO ====== -->
      <div id="Editor" translate="no">
        <div id="Editor-Input" style="width: 100%; height: 100%"></div>
      </div>

      <!-- ====== OPTIONS PANEL / PAINEL DE OPÇÕES ====== -->
      <div id="options">
        <button id="save-button" style="display: none" title="Save"></button>
        <button id="load-button" title="Upload file">Upload</button>
        <button
          id="clear"
          title="Clear all code"
          onclick="window.editor.setValue('')"
        >
          Clear
        </button>
        <button
          id="execute"
          style="display: none"
          title="Run your code"
          onclick="execute()"
        >
          Run
        </button>
        <button id="download-file" title="Download file">Download</button>
        <button
          id="new-iframe-button"
          style="display: none"
          title="Copy a new Iframe"
          onclick="newIframe()"
        >
          Iframe
        </button>

        <!-- ====== SOCIAL LINKS / REDES SOCIAIS ====== -->
        <div id="social-links">
          <a
            id="youtube-link"
            href="https://www.youtube.com/@caixa_brasil"

            title="Follow me on YouTube!"

      <!-- ====== CODE LANGUAGE DISPLAY / EXIBIÇÃO DA LINGUAGEM ====== -->
      <div id="code-language">
        <h4>Start writing your code and see the language here!</h4>
      </div>

      <!-- ====== DYNAMIC PANEL / PAINEL DINÂMICO ====== -->
      <div id="dynamic-panel" aria-live="polite">
        <span id="dynamic-panel-text">🕒 Carregando...</span>
      </div>

      <!-- ====== SETTINGS PANEL / PAINEL DE CONFIGURAÇÕES ====== -->
      <div id="config">
        <h1>Settings</h1>
        <h3>Editor theme:</h3>
        <select id="theme-select" title="Select Theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="solarized-light">Solarized Light</option>
          <option value="auto">Automatic</option></select
        ><br />
        <label for="auto-fest-checkbox">
          <input type="checkbox" id="auto-fest-checkbox" checked />
          | Automatically change theme based on holidays. </label
        ><br />
        <h3>AI (NightCoder)</h3>
        <button id="clearIAChat" onclick="clearChatStorage()">
          Delete AI Chat
        </button>
        <br /><br />
        Edit AI Prompt
        <br /><textarea
          id="system-prompt-editor"
          placeholder="NightCoder system behavior..."
          style="height: 120px"
        ></textarea
        ><br />

        <button onclick="saveSystemPrompt()">Save AI Behavior</button>
        <button onclick="deleteSystemPrompt()">Reset AI Behavior</button>

        <h3>Border color</h3>
        <label for="border-color-input"
          >Border color for orange elements:</label
        >
        <input type="color" id="border-color-input" value="#ff8a3d" />
        <button type="button" id="reset-border-color">Reset</button>
        <br /><br />
        <h3>Accent color</h3>
        <label for="accent-color-input">Text accent color:</label>
        <input type="color" id="accent-color-input" value="#ff6700" />
        <button type="button" id="reset-accent-color">Reset</button>
        <br /><br />

        <h3>Extras:</h3>
        <label for="bg-image-checkbox">
          <input type="checkbox" id="bg-image-checkbox" />
          | Enable background image.
        </label>
        <br />
        <label for="bg-image-file">Choose image:</label>
        <input type="file" id="bg-image-file" accept="image/*" />
        <br />
        <label for="bg-blur-range"
          >Background blur: <span id="bg-blur-value">6</span>px</label
        >
        <input type="range" id="bg-blur-range" min="0" max="20" value="6" />
        <br />
        <label for="dev-mode-checkbox">
          <input type="checkbox" id="dev-mode-checkbox" />
          | Debug mode (shows additional information). </label
        ><br /><br />
      </div>

      <div id="chat" style="display: none">
        <h1>NightCoder</h1>
        <img
          id="chat-welcome"
          src="Extras/Assets/NightCoder.png"
          alt="NightCoder"
          style="
            width: 100%;
            max-width: 260px;
            margin: 40px auto;
            display: none;
            opacity: 0.85;
            pointer-events: none;
          "
        />
        <div id="messages"></div>

        <div id="input-area">
          <textarea id="input" placeholder="Type your message..."></textarea>
          <button id="send">Send</button>
        </div>
      </div>

      <div id="inline-chat">
        <div id="inline-messages"></div>

        <div id="inline-input-area">
          <textarea
            id="inline-input"
            placeholder="Type your inline request..."
          ></textarea>
          <button id="inline-send">Enviar</button>
        </div>
      </div>

      <h1 id="signature">LUIZzz</h1>

      <!-- ====== FILE INPUT (HIDDEN) / INPUT DE ARQUIVOS INVISÍVEL ====== -->
      <input
        type="file"
        id="file-input"
        title="none"
        aria-hidden="true"
        tabindex="-1"
        style="display: none"
        accept=".js,.html,.css,.txt,.json,.java,.py,.cpp,.c,.cmd,.pyw,.sbv,.txt,.vcf,.bat,.md"
      />

      <!-- ====== MAIN SCRIPTS / SCRIPTS PRINCIPAIS ====== -->
      <script src="Extras/Code/config.js" type="module"></script>
      <script src="Core/plugin-engine.js" type="module"></script>
    </div>
  </body>
</html>
