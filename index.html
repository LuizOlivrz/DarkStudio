    <div id="mindmap-container" style="
          display: none;
          width: 100%;
          height: 100%;
          position: relative;
          overflow: hidden;
          background: #090909;

            position: absolute;
            inset: 0;

    <!-- ====== OPTIONS PANEL / PAINEL DE OPÇÕES ====== -->
    <div id="options">
      <button id="save-button" style="display: none" title="Save"></button>
      <button id="load-button" title="Upload file">Upload</button>
      <button id="clear" title="Clear all code" onclick="window.editor.setValue('')">
        Clear
      </button>
      <button id="execute" style="display: none" title="Run your code" onclick="execute()">
        Run
      </button>
      <button id="download-file" title="Download file">Download</button>
      <button id="new-iframe-button" style="display: none" title="Copy a new Iframe" onclick="newIframe()">
        Iframe
      </button>
      <button id="mindmap-add-files" title="Adicionar arquivos ao mapa" style="display: none">
        Add
      </button>
      <button id="mindmap-connect" title="Conectar nós do mapa" style="display: none">
        Connect
      </button>
      <button id="mindmap-clear" title="Limpar mapa mental" style="display: none">
        Clear
      </button>

      <button id="mindmap-button" title="Mapa Mental">Mind Map</button>
    </div>

    <!-- ====== SETTINGS PANEL / PAINEL DE CONFIGURAÇÕES ====== -->
    <div id="config">
      <h1>Settings</h1>
      <h3>Editor theme:</h3>
      <select id="theme-select" title="Select Theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="solarized-dark">Solarized Dark</option>
        <option value="solarized-light">Solarized Light</option>
        <option value="auto">Automatic</option>
      </select><br />
      <label for="auto-fest-checkbox">
        <input type="checkbox" id="auto-fest-checkbox" checked />
        | Automatically change theme based on holidays. </label><br />
      <h3>AI (NightCoder)</h3>
      <button id="clearIAChat" onclick="clearChatStorage()">
        Delete AI Chat
      </button>
      <br /><br />
      Edit AI Prompt
      <br /><textarea id="system-prompt-editor" placeholder="NightCoder system behavior..."
        style="height: 120px"></textarea><br />

      <button onclick="saveSystemPrompt()">Save AI Behavior</button>
      <button onclick="deleteSystemPrompt()">Reset AI Behavior</button>

      <h3>Border color</h3>
      <label for="border-color-input">Border color for orange elements:</label>
      <input type="color" id="border-color-input" value="#ff8a3d" />
      <button type="button" id="reset-border-color">Reset</button>
      <br /><br />
      <h3>Accent color</h3>
      <label for="accent-color-input">Text accent color:</label>
      <input type="color" id="accent-color-input" value="#ff6700" />
      <button type="button" id="reset-accent-color">Reset</button>
      <br /><br />

      <h3>Extras:</h3>
      <label for="bg-image-checkbox">
        <input type="checkbox" id="bg-image-checkbox" />
        | Enable background image.
      </label>
      <br />
      <label for="bg-image-file">Choose image:</label>
      <input type="file" id="bg-image-file" accept="image/*" />
      <br />
      <label for="bg-blur-range">Background blur: <span id="bg-blur-value">6</span>px</label>
      <input type="range" id="bg-blur-range" min="0" max="20" value="6" />
      <br />
      <label for="dev-mode-checkbox">
        <input type="checkbox" id="dev-mode-checkbox" />
        | Debug mode (shows additional information). </label><br /><br />
      <h3>Signature</h3>
      <label for="signature-input">Your signature (max 22 chars):</label><br>
      <input type="text" id="signature-input" value="LUIZzz" maxlength="22" /><br>
      <button type="button" id="reset-signature">Reset</button>
      <br /><br /><br />
