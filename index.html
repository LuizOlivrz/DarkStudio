<!doctype html>
<html lang="en">
  <head>
    <!-- ====== BASIC META / METADADOS BÁSICOS ====== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ====== SEO & IDENTIFICATION / SEO E IDENTIFICAÇÃO ====== -->
    <title>DarkStudio</title>
    <meta
      name="google-site-verification"
      content="-sB3DJOfvAJQBVoavPb6dxxWae8Bs2Q5q8P1Czt67wM"
    />
    <meta name="description" content="DarkStudio — Coding into the night 🌃." />
    <meta name="keywords" content="DarkStudio, Editor, DS" />
    <meta name="author" content="Luiz (CDP)" />
    <meta name="robots" content="index, follow" />

    <!-- ====== APPEARANCE & ICONS / APARÊNCIA E ÍCONES ====== -->
    <meta id="theme-color" name="theme-color" content="#111" />
  </head>

  <body style="background-color: black">
    <div id="Website-Container" style="opacity: 0">
      <!-- Full-page background element (controlled from Settings) -->
      <div id="page-bg" aria-hidden="true">
        <img
          onclick="hideAll()"
          id="page-bg-img"
          src=""
          alt="Background image"
        />
      </div>

      <!-- ====== NETWORK STATUS / STATUS DA REDE ====== -->
      <span id="network-status">Position</span>

      <!-- ====== CONFIGURATION ICON / ÍCONE DE CONFIGURAÇÃO ====== -->
      <div id="config-toggle" onclick="config()">
        <img
          id="config-icon"
          src="https://cdn2.iconfinder.com/data/icons/data-management-38/24/file-settings-512.png"
          alt="Settings icon"
        />
      </div>

      <!-- ====== CODE EDITOR / EDITOR DE CÓDIGO ====== -->
      <div id="Editor" translate="no">
        <div id="Editor-Input" style="width: 100%; height: 100%"></div>
      </div>
      <!-- ====== OPTIONS PANEL / PAINEL DE OPÇÕES ====== -->
      <div id="options">
        <button id="save-button" style="display: none" title="Save"></button>
        <button id="load-button" title="Upload file">Upload</button>
        <button
          id="clear"
          title="Clear all code"
          onclick="window.editor.setValue('')"
        >
          Clear
        </button>
        <button
          id="execute"
          style="display: none"
          title="Run your code"
          onclick="execute()"
        >
          Run
        </button>
        <button id="download-file" title="Download file">Download</button>
        <button
          id="new-iframe-button"
          style="display: none"
          title="Copy a new Iframe"
          onclick="newIframe()"
        >
          Iframe
        </button>

        <!-- ====== SOCIAL LINKS / REDES SOCIAIS ====== -->
        <div id="social-links">
          <a
            id="youtube-link"
            href="https://www.youtube.com/@caixa_brasil"
            target="_blank"
            title="Follow me on YouTube!"
          >
            <!-- YouTube SVG Icon -->
            <svg
              id="youtube-logo"
              width="24"
              height="24"
              viewBox="0 -0.5 25 25"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M18.168 19.0028C20.4724 19.0867 22.41 17.29 22.5 14.9858V9.01982C22.41 6.71569 20.4724 4.91893 18.168 5.00282H6.832C4.52763 4.91893 2.58998 6.71569 2.5 9.01982V14.9858C2.58998 17.29 4.52763 19.0867 6.832 19.0028H18.168Z"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M12.008 9.17784L15.169 11.3258C15.3738 11.4454 15.4997 11.6647 15.4997 11.9018C15.4997 12.139 15.3738 12.3583 15.169 12.4778L12.008 14.8278C11.408 15.2348 10.5 14.8878 10.5 14.2518V9.75184C10.5 9.11884 11.409 8.77084 12.008 9.17784Z"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>
      </div>

      <!-- ====== CODE LANGUAGE DISPLAY / EXIBIÇÃO DA LINGUAGEM ====== -->
      <div id="code-language">
        <h4>Start writing your code and see the language here!</h4>
      </div>

      <!-- ====== SETTINGS PANEL / PAINEL DE CONFIGURAÇÕES ====== -->
      <div id="config">
        <h1>Settings</h1>
        <h3>Editor theme:</h3>
        <select id="theme-select" title="Select Theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="solarized-light">Solarized Light</option>
          <option value="auto">Automatic</option></select
        ><br />
        <label for="auto-fest-checkbox">
          <input type="checkbox" id="auto-fest-checkbox" checked />
          | Automatically change theme based on holidays. </label
        ><br />
        <h3>AI (NightCoder)</h3>
        <button id="clearIAChat" onclick="clearChatStorage()">
          Delete AI Chat
        </button>
        <br /><br />
        Edit AI Prompt
        <br /><textarea
          id="system-prompt-editor"
          placeholder="NightCoder system behavior..."
          style="
            height: 120px;
            background: #0b0b0b;
            color: #ff6700;
            border: 2px solid #ff6700;
            border-radius: 6px;
            padding: 8px;
            font-family: monospace;
            resize: vertical;
          "
        ></textarea
        ><br />

        <button onclick="saveSystemPrompt()">Save AI Behavior</button>
        <button onclick="deleteSystemPrompt()">Reset AI Behavior</button>

        <h3>Extras:</h3>
        <label for="bg-image-checkbox">
          <input type="checkbox" id="bg-image-checkbox" />
          | Enable background image.
        </label>
        <br />
        <label for="bg-image-file">Choose image:</label>
        <input type="file" id="bg-image-file" accept="image/*" />
        <br />
        <label for="bg-blur-range"
          >Background blur: <span id="bg-blur-value">6</span>px</label
        >
        <input type="range" id="bg-blur-range" min="0" max="20" value="6" />
        <br />
        <label for="dev-mode-checkbox">
          <input type="checkbox" id="dev-mode-checkbox" />
          | Debug mode (shows additional information). </label
        ><br /><br />
      </div>

      <div id="chat" style="display: none">
        <h1>NightCoder</h1>
        <img
          id="chat-welcome"
          src="Extras/Assets/NightCoder.png"
          alt="NightCoder"
          style="
            width: 100%;
            max-width: 260px;
            margin: 40px auto;
            display: none;
            opacity: 0.85;
            pointer-events: none;
          "
        />
        <div id="messages"></div>

        <div id="input-area">
          <textarea id="input" placeholder="Type your message..."></textarea>
          <button id="send">Send</button>
        </div>
      </div>

      <div id="inline-chat">
        <div id="inline-messages"></div>

        <div id="inline-input-area">
          <textarea
            id="inline-input"
            placeholder="Type your inline request..."
          ></textarea>
          <button id="inline-send">Enviar</button>
        </div>
      </div>

      <!-- ====== FILE INPUT (HIDDEN) / INPUT DE ARQUIVOS INVISÍVEL ====== -->
      <input
        type="file"
        id="file-input"
        title="none"
        aria-hidden="true"
        tabindex="-1"
        style="display: none"
        accept=".js,.html,.css,.txt,.json,.java,.py,.cpp,.c,.cmd,.pyw,.sbv,.txt,.vcf,.bat,.md"
      />

      <!-- ====== MAIN SCRIPTS / SCRIPTS PRINCIPAIS ====== -->
      <script src="Extras/Code/config.js" type="module"></script>
      <script src="Core/plugin-engine.js" type="module"></script>
    </div>
  </body>
</html>
