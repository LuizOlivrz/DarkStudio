<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ====== BASIC META / METADADOS BÁSICOS ====== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ====== SEO & IDENTIFICATION / SEO E IDENTIFICAÇÃO ====== -->
    <title>DarkStudio</title>
    <meta
      name="google-site-verification"
      content="-sB3DJOfvAJQBVoavPb6dxxWae8Bs2Q5q8P1Czt67wM"
    />
    <meta name="description" content="DarkStudio — Coding into the night 🌃." />
    <meta name="keywords" content="DarkStudio, Editor, DS" />
    <meta name="author" content="Luiz (CDP)" />
    <meta name="robots" content="index, follow" />

    <!-- ====== APPEARANCE & ICONS / APARÊNCIA E ÍCONES ====== -->
    <meta name="theme-color" content="#111" />
  </head>

  <body style="background-color: black">
    <div
      id="Website-Container"
      style="opacity: 0; transition: opacity 1.5s ease"
    >
      <!-- ====== SPOTIFY MINI PLAYER ====== -->
      <div id="spotify-now-playing">
        <div id="mini-player" onclick="fullScreenVerif()">
          <img id="album-art" src="" alt="Album cover" />
          <div id="track-info" class="track-info" translate="no">
            <h5 id="track-name">Loading...</h5>
            <p id="artist-name"></p>
          </div>
        </div>

        <!-- Spotify control buttons -->
        <button id="login">Connect to Spotify</button>
        <button id="close" style="display: none" onclick="fullScreenVerif()">
          <p>Exit full screen</p>
        </button>
      </div>

      <!-- ====== NETWORK STATUS / STATUS DA REDE ====== -->
      <span id="network-status"></span>

      <!-- ====== CONFIGURATION ICON / ÍCONE DE CONFIGURAÇÃO ====== -->
      <div id="spotify-profile-container" onclick="config()">
        <img
          id="spotify-profile-pic"
          src="https://cdn2.iconfinder.com/data/icons/data-management-38/24/file-settings-512.png"
          alt="Spotify profile picture"
        />
      </div>

      <!-- ====== CODE EDITOR / EDITOR DE CÓDIGO ====== -->
      <div id="Editor" translate="no">
        <div id="Editor-Input" style="width: 100%; height: 100%"></div>
      </div>
      <!-- ====== OPTIONS PANEL / PAINEL DE OPÇÕES ====== -->
      <div id="options">
        <button id="save-button" style="display: none" title="Save"></button>
        <button id="load-button" title="Upload file">Upload</button>
        <button
          id="clear"
          title="Clear all code"
          onclick="window.editor.setValue('')"
        >
          Clear
        </button>
        <button
          id="execute"
          style="display: none"
          title="Run your code"
          onclick="execute()"
        >
          Run
        </button>
        <button id="download-file" title="Download file">Download</button>
        <button
          id="new-iframe-button"
          style="display: none"
          title="Copy a new Iframe"
          onclick="newIframe()"
        >
          Iframe
        </button>

        <!-- ====== SOCIAL LINKS / REDES SOCIAIS ====== -->
        <div id="social-links">
          <a
            id="youtube-link"
            href="https://www.youtube.com/@caixa_brasil"
            target="_blank"
            title="Follow me on YouTube!"
          >
            <!-- YouTube SVG Icon -->
            <svg
              id="youtube-logo"
              width="24"
              height="24"
              viewBox="0 -0.5 25 25"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M18.168 19.0028C20.4724 19.0867 22.41 17.29 22.5 14.9858V9.01982C22.41 6.71569 20.4724 4.91893 18.168 5.00282H6.832C4.52763 4.91893 2.58998 6.71569 2.5 9.01982V14.9858C2.58998 17.29 4.52763 19.0867 6.832 19.0028H18.168Z"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M12.008 9.17784L15.169 11.3258C15.3738 11.4454 15.4997 11.6647 15.4997 11.9018C15.4997 12.139 15.3738 12.3583 15.169 12.4778L12.008 14.8278C11.408 15.2348 10.5 14.8878 10.5 14.2518V9.75184C10.5 9.11884 11.409 8.77084 12.008 9.17784Z"
                stroke="#000000"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>
      </div>

      <!-- ====== CODE LANGUAGE DISPLAY / EXIBIÇÃO DA LINGUAGEM ====== -->
      <div id="code-language">
        <h4>Start writing your code and see the language here!</h4>
      </div>

      <!-- ====== FULL SCREEN SPOTIFY MODE / MODO DE TELA CHEIA DO SPOTIFY ====== -->
      <div id="full-screen" style="opacity: 0">
        <img
          id="album-art-full"
          src=""
          alt="Album cover"
          style="transition: width 1s ease-in-out"
        />
        <div
          id="track-info-full"
          class="track-info-full"
          translate="no"
          style="opacity: 0"
        >
          <h5 id="track-name-full" style="font-size: 23px">Loading...</h5>
          <p id="artist-name-full"></p>
        </div>

        <!-- Spotify logo -->
        <svg id="spotify-logo-full" viewBox="0 0 236.05 225.25">
          <path
            class="cls-1"
            fill="#231f20"
            d="m122.37,3.31C61.99.91,11.1,47.91,8.71,108.29c-2.4,60.38,44.61,111.26,104.98,113.66,60.38,2.4,111.26-44.6,113.66-104.98C229.74,56.59,182.74,5.7,122.37,3.31Zm46.18,160.28c-1.36,2.4-4.01,3.6-6.59,3.24-.79-.11-1.58-.37-2.32-.79-14.46-8.23-30.22-13.59-46.84-15.93-16.62-2.34-33.25-1.53-49.42,2.4-3.51.85-7.04-1.3-7.89-4.81-.85-3.51,1.3-7.04,4.81-7.89,17.78-4.32,36.06-5.21,54.32-2.64,18.26,2.57,35.58,8.46,51.49,17.51,3.13,1.79,4.23,5.77,2.45,8.91Zm14.38-28.72c-2.23,4.12-7.39,5.66-11.51,3.43-16.92-9.15-35.24-15.16-54.45-17.86-19.21-2.7-38.47-1.97-57.26,2.16-1.02.22-2.03.26-3.01.12-3.41-.48-6.33-3.02-7.11-6.59-1.01-4.58,1.89-9.11,6.47-10.12,20.77-4.57,42.06-5.38,63.28-2.4,21.21,2.98,41.46,9.62,60.16,19.74,4.13,2.23,5.66,7.38,3.43,11.51Zm15.94-32.38c-2.1,4.04-6.47,6.13-10.73,5.53-1.15-.16-2.28-.52-3.37-1.08-19.7-10.25-40.92-17.02-63.07-20.13-22.15-3.11-44.42-2.45-66.18,1.97-5.66,1.15-11.17-2.51-12.32-8.16-1.15-5.66,2.51-11.17,8.16-12.32,24.1-4.89,48.74-5.62,73.25-2.18,24.51,3.44,47.99,10.94,69.81,22.29,5.12,2.66,7.11,8.97,4.45,14.09Z"
          />
        </svg>
      </div>

      <!-- ====== SETTINGS PANEL / PAINEL DE CONFIGURAÇÕES ====== -->
      <div id="config">
        <h1>Settings</h1>
        <div id="auto-back-complete">
          <label for="auto-background-checkbox">
            <input type="checkbox" id="auto-background-checkbox" checked />
            | Automatic background based on album cover. </label
          ><br />
        </div>
        <label for="spotify-checkbox">
          <input type="checkbox" id="spotify-checkbox" checked />
          | Show Spotify song. </label
        ><br />
        <h3>Editor theme:</h3>
        <select id="theme-select" title="Select Theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="solarized-light">Solarized Light</option>
          <option value="auto">Automatic</option></select
        ><br />
        <label for="auto-fest-checkbox">
          <input type="checkbox" id="auto-fest-checkbox" checked />
          | Automatically change theme based on holidays. </label
        ><br />
        <h3>Extras:</h3>
        <label for="dev-mode-checkbox">
          <input type="checkbox" id="dev-mode-checkbox" />
          | Debug mode (shows additional information). </label
        ><br /><br />
        <button id="logout-spotify" onclick="spotifyLogout();">
          Log out of Spotify
        </button>
        <br /><br />
      </div>

      <div id="chat" style="opacity: 0; display: none">
        <div id="messages"></div>

        <div id="input-area">
          <textarea id="input" placeholder="Type your message..."></textarea>
          <button id="send">Enviar</button>
        </div>
      </div>

      <div id="inline-chat">
        <div id="inline-messages"></div>

        <div id="inline-input-area">
          <textarea
            id="inline-input"
            placeholder="Type your inline request..."
          ></textarea>
          <button id="inline-send">Enviar</button>
        </div>
      </div>

      <!-- ====== FILE INPUT (HIDDEN) / INPUT DE ARQUIVOS INVISÍVEL ====== -->
      <input
        type="file"
        id="file-input"
        title="none"
        aria-hidden="true"
        tabindex="-1"
        style="display: none"
        accept=".js,.html,.css,.txt,.json,.java,.py,.cpp,.c,.cmd,.pyw,.sbv,.txt,.vcf,.bat,.md"
      />

      <!-- ====== MAIN SCRIPTS / SCRIPTS PRINCIPAIS ====== -->
      <script src="Code/config.js" type="module"></script>
    </div>
  </body>
</html>
