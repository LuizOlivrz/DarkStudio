<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarkStudio</title>
  <link rel="stylesheet" href="Dark.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
  <link
    rel="icon"
    type="image/jpeg"
    href="https://i.postimg.cc/1txBHHJn/Design-sem-nome-4.png"
  />
</head>
<body>
  <div id="spotify-now-playing">
<img onclick="fullScreenVerif()" id="album-art" src="" alt="Capa do álbum" />
<div onclick="fullScreenVerif()" translate="no" id="track-info" class="track-info">

      <h5 id="track-name">Carregando...</h5>
      <p id="artist-name">—</p>
    </div>
    <div id="spotify-profile-container">
      <img id="spotify-profile-pic" src="" alt="Foto de perfil do Spotify"/>
    </div>
    <button id="login">Conectar ao Spotify</button>
    <button onclick="fullScreenVerif()" tabindex="-1" style="display: none;" id="close">Fechar tela cheia</button>
  </div>

  <div id="Editor" translate="no">
    <div id="Editor-Input" style="width: 100%; height: 100%"></div>
  </div>

  <div id="options">
    <button style="display: none;" id="save-button" title="Salvar"></button>
    <button id="load-button" title="Upload de arquivo">Carregar</button>
    <button onclick="window.editor.setValue('')" id="clear" title="apagar o código">Limpar</button>
    <button style="display: none;" onclick="execute()" id="execute">Executar</button>
    <button id="download-file">Download</button>
    <button style="display: none;" onclick="newIframe()" id="new-iframe-button">Iframe</button>
  </div>


  <div id="code-language">
    <h4>Começe a escever seus códigos e veja a linguagem aqui!</h4>
  </div>

  <div id="full-screen" style="opacity: 0;">
    <img id="album-art-full" style="transition: width 1s ease-in-out;" src="" alt="Capa do álbum" />
    <div id="track-info-full" translate="no" style="opacity: 0;" class="track-info-full">
      <h5 id="track-name-full" style="font-size: 23px;">Carregando...</h5>
      <p id="artist-name-full">—</p>
    </div>
    <svg id="spotify-logo-full" viewBox="0 0 236.05 225.25"><defs><style>.cls-1{fill:#231f20;stroke-width:0px;}</style></defs><path class="cls-1" d="m122.37,3.31C61.99.91,11.1,47.91,8.71,108.29c-2.4,60.38,44.61,111.26,104.98,113.66,60.38,2.4,111.26-44.6,113.66-104.98C229.74,56.59,182.74,5.7,122.37,3.31Zm46.18,160.28c-1.36,2.4-4.01,3.6-6.59,3.24-.79-.11-1.58-.37-2.32-.79-14.46-8.23-30.22-13.59-46.84-15.93-16.62-2.34-33.25-1.53-49.42,2.4-3.51.85-7.04-1.3-7.89-4.81-.85-3.51,1.3-7.04,4.81-7.89,17.78-4.32,36.06-5.21,54.32-2.64,18.26,2.57,35.58,8.46,51.49,17.51,3.13,1.79,4.23,5.77,2.45,8.91Zm14.38-28.72c-2.23,4.12-7.39,5.66-11.51,3.43-16.92-9.15-35.24-15.16-54.45-17.86-19.21-2.7-38.47-1.97-57.26,2.16-1.02.22-2.03.26-3.01.12-3.41-.48-6.33-3.02-7.11-6.59-1.01-4.58,1.89-9.11,6.47-10.12,20.77-4.57,42.06-5.38,63.28-2.4,21.21,2.98,41.46,9.62,60.16,19.74,4.13,2.23,5.66,7.38,3.43,11.51Zm15.94-32.38c-2.1,4.04-6.47,6.13-10.73,5.53-1.15-.16-2.28-.52-3.37-1.08-19.7-10.25-40.92-17.02-63.07-20.13-22.15-3.11-44.42-2.45-66.18,1.97-5.66,1.15-11.17-2.51-12.32-8.16-1.15-5.66,2.51-11.17,8.16-12.32,24.1-4.89,48.74-5.62,73.25-2.18,24.51,3.44,47.99,10.94,69.81,22.29,5.12,2.66,7.11,8.97,4.45,14.09Z"/></svg>
    <img id="spotify-profile-pic-full" src="https://i.scdn.co/image/ab6775700000ee856277865793ced04ee0db293c" alt="Foto de perfil do Spotify full"/>
  </div>

  <input
    type="file"
    placeholder="Upload de arquivo para o editor"
    id="file-input"
    style="display: none"
    accept=".js,.html,.css,.txt,.json,.java,.py,.cpp,.c,.cmd,.pyw,.sbv,.txt,.vcf,.bat"
  />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.min.js"></script>

  <script>

let font = 14;

    require.config({
      paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs" },
    });

    require(["vs/editor/editor.main"], function () {
      // 1) Definir tema antes do editor
monaco.editor.defineTheme("darkStudio", {
  base: "vs-dark",
  inherit: true,
  rules: [
    // === GERAL ===
    { token: "", foreground: "8F8700", background: "090909" },
    { token: "comment", foreground: "00FFB1", fontStyle: "italic" },
    { token: "number", foreground: "8F8700" },
    { token: "string", foreground: "FFB700" },
    { token: "keyword", foreground: "FF6500", fontStyle: "bold" },
    { token: "operator", foreground: "FF6700" },
    { token: "delimiter", foreground: "AAAAAA" },
    { token: "variable", foreground: "00BD82" },
    { token: "constant", foreground: "00BDFF" },
    { token: "type", foreground: "FF6700" },
    
    // === CSS ===
    { token: "attribute.name.css", foreground: "FFF200" },
    { token: "attribute.value.css", foreground: "00BD82" },
    { token: "selector.css", foreground: "FF6600", fontStyle: "bold" },
    { token: "property.css", foreground: "FFF200" },
    { token: "delimiter.css", foreground: "00DB95" }, // ;
    { token: "number.css", foreground: "00ffff" },
    { token: "string.css", foreground: "00FFB7" },
    { token: "tag.css", foreground: "FF6500"},

    // === HTML ===
    { token: "tag.html", foreground: "FF6700", fontStyle: "bold" },
    { token: "attribute.name.html", foreground: "CF5400" },
    { token: "attribute.value.html", foreground: "00BD82" },
    { token: "delimiter.html", foreground: "FFF200" },
    { token: "metatag.html", foreground: "FF0000" },

    // === JS / JSON ===
    { token: "keyword.js", foreground: "FF6500" },
    { token: "number.js", foreground: "00BD82", fontStyle: "italic" },
    { token: "string.js", foreground: "00BD82", fontStyle: "italic" },
    { token: "identifier.js", foreground: "FFF200" },
    { token: "delimiter.js", foreground: "FF6500" },
    { token: "comment.js", foreground: "8F8700" },
    { token: "keyword.css", foreground: "00FF55"},
    { token: "string.key.json", foreground: "FF6500" },
    { token: "string.value.json", foreground: "FFD700", fontStyle: "italic" },
    { token: "number.json", foreground: "FFD700", fontStyle: "italic" },
    { token: "keyword.json", foreground: "CF5400" },
  ],

  colors: {
    // Fundo e texto base
    "editor.background": "#090909",
    "editor.foreground": "#E6E6E6",

    // Cursor e seleção
    "editorCursor.foreground": "#FFFFFF",
    "editor.selectionBackground": "#1B1B1B",
    "editor.inactiveSelectionBackground": "#222222",

    // Linhas e realce
    "editor.lineHighlightBackground": "#111111",
    "editorLineNumber.foreground": "#444",
    "editorLineNumber.activeForeground": "#FF6700",

    // Minimapa
    "minimap.findMatchHighlight": "#FF6700",
    "minimap.selectionHighlight": "#00FF7F",

    // Barra lateral e scroll
    "scrollbarSlider.background": "#FF670033",
    "scrollbarSlider.hoverBackground": "#FF670055",
    "scrollbarSlider.activeBackground": "#FF670077",

    // Realce de erro e aviso
    "editorError.foreground": "#FF3333",
    "editorWarning.foreground": "#FFB700",
    "editorInfo.foreground": "#00FFB7",
  },
});


      // 2) Criar editor com o tema customizado
      window.editor = monaco.editor.create(document.getElementById("Editor-Input"), {
        value: `Escreva seu código aqui`,
        language: "plaintext", // tema padrão inicial
        theme: "darkStudio",
        automaticLayout: true,
        fontSize: font,
        minimap: { enabled: false },
      });

      // Função debounce para limitar chamadas repetidas
      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      // Função que salva no localStorage
      function saveCode() {
        const code = window.editor.getValue();
        localStorage.setItem("codigoSalvo", code);
        console.log("Código salvo automaticamente");
      }

      // Salvar automático com debounce de 1 segundo
      const saveDebounced = debounce(saveCode, 1000);

      // Evento que dispara quando o conteúdo do editor muda
      window.editor.onDidChangeModelContent(() => {
        saveDebounced();
      });

      // Ao criar o editor, carregar código salvo
      const savedCode = localStorage.getItem("codigoSalvo");
      if (savedCode) {
        window.editor.setValue(savedCode);
      }

      // Botões de salvar/carregar
      document.getElementById("load-button").addEventListener("click", () => {
        const saved = localStorage.getItem("codigoSalvo");
        if (saved) window.editor.setValue(saved);
      });

      // Botão para abrir o seletor de arquivo
      document.getElementById("load-button").addEventListener("click", () => {
        document.getElementById("file-input").click();
      });

      // Leitura do arquivo selecionado
      document.getElementById("file-input").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (e) {
          const content = e.target.result;
          window.editor.setValue(content);
          console.log("Código carregado do arquivo!");
        };

        reader.onerror = function () {
          alert("Erro ao ler o arquivo.");
        };

        reader.readAsText(file);
      });
    });


    function newIframe() {
  // Pega o código do editor
  const codigo = window.editor.getValue();

  // Cria o iframe em string (HTML que o usuário pode copiar)
  const iframeHTML = `<iframe width="100%" height="400px"
  srcdoc='${codigo.replace(/'/g, "&apos;")}'
  style="border:1px solid #444;"
  sandbox="allow-scripts allow-same-origin">
  </iframe>`;

  // Copia para o clipboard
  navigator.clipboard.writeText(iframeHTML)
    .then(() => {
      alert("Iframe copiado! Cole onde desejar.");
    })
    .catch(err => {
      console.error("Erro ao copiar iframe:", err);
      alert("Não foi possível copiar o iframe.");
    });
}
  </script>

  <script src="Spotify.js"></script>
  <script src="main.js"></script>
</body>
</html>
